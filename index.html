  <script>
    // Save username after user input
    function saveUsername() {
      const username = document.getElementById('username-input').value;
      if (username.trim()) {
        localStorage.setItem('username', username); // Save username locally
        document.getElementById('username-section').style.display = 'none';
        document.getElementById('videos-section').style.display = 'block';
      } else {
        alert('Please enter your name!');
      }
    }

    // Function to submit a comment
    async function submitComment(videoId) {
      const username = localStorage.getItem('username'); // Get stored username
      const commentInput = document.getElementById(`comment-input-${videoId}`);
      const comment = commentInput.value;

      if (comment.trim()) {
        const response = await fetch('https://vbscom.onrender.com/api/comments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ videoId, username, comment })
        });

        if (response.ok) {
          commentInput.value = '';
          loadComments(videoId); // Refresh comments
        } else {
          alert('Error submitting comment!');
        }
      } else {
        alert('Please write a comment before submitting.');
      }
    }

// Function to display comments, with new comments at the top
function displayLimitedComments(videoId, limit) {
  const commentsContainer = document.getElementById(`comments-${videoId}`);
  const allComments = JSON.parse(commentsContainer.dataset.fullComments);

  // Reverse the comments to show the newest ones at the top
  const reversedComments = allComments.slice().reverse();
  commentsContainer.innerHTML = ''; // Clear existing comments

  reversedComments.slice(0, limit).forEach(({ username, comment }) => {
    const p = document.createElement('p');
    p.textContent = `${username}: ${comment}`;
    commentsContainer.appendChild(p);
  });

  // Show or hide buttons based on comment count
  document.getElementById(`read-more-button-${videoId}`).style.display =
    reversedComments.length > limit ? 'block' : 'none';
  document.getElementById(`show-less-button-${videoId}`).style.display = limit > 10 ? 'block' : 'none';
}

// Function to show more comments
function showMoreComments(videoId) {
  const commentsContainer = document.getElementById(`comments-${videoId}`);
  const allComments = JSON.parse(commentsContainer.dataset.fullComments);

  displayLimitedComments(videoId, allComments.length); // Display all comments
}

// Function to show less (collapse) comments
function showLessComments(videoId) {
  displayLimitedComments(videoId, 10); // Display the first 10 comments
}



    // Function to add a like
    async function addLike(videoId) {
      const response = await fetch('https://vbscom.onrender.com/api/likes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ videoId })
      });

      if (response.ok) {
        const data = await response.json();
        document.getElementById(`like-count-${videoId}`).textContent = `${data.likes} Likes`;
      } else {
        alert('Error adding like!');
      }
    }

    // Periodically fetch likes and comments
// Periodically fetch likes and comments
function startAutoRefresh(videoId) {
  setInterval(async () => {
    try {
      // Update likes and comments without user interaction
      await updateLikes(videoId);
      await loadComments(videoId);
    } catch (error) {
      console.error('Error during auto-refresh:', error);
    }
  }, 5000); // Refresh every 5 seconds
}

    async function updateLikes(videoId) {
  try {
    const response = await fetch(`https://vbscom.onrender.com/api/likes/${videoId}`);
    if (!response.ok) {
      throw new Error(`Error fetching likes: ${response.status} ${response.statusText}`);
    }
    const data = await response.json();
    document.getElementById(`like-count-${videoId}`).textContent = `${data.likes} Likes`;
  } catch (error) {
    console.error('Failed to update likes:', error);
  }
}

    // Function to load and display comments
async function loadComments(videoId) {
  const response = await fetch(`https://vbscom.onrender.com/api/comments/${videoId}`);
  const data = await response.json();

  const commentsContainer = document.getElementById(`comments-${videoId}`);
  commentsContainer.dataset.fullComments = JSON.stringify(data.comments); // Store all comments
  displayLimitedComments(videoId, 10); // Initially display the first 10 comments
}
